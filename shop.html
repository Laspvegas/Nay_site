    </footer>
);

/* ── Cart Modal ── */
const CartModal = ({ isOpen, onClose, items }) => {
    if (!isOpen) return null;
    const total = items.reduce((sum, item) => sum + item.price, 0);

    return (
        <div className="fixed inset-0 z-[100] flex justify-end">
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose}></div>
            <div className="relative w-full max-w-md bg-[#0a0a0a] border-l border-gray-800 h-full flex flex-col shadow-2xl transform transition-transform duration-300">
                <div className="p-6 border-b border-gray-800 flex justify-between items-center">
                    <h2 className="text-xl tracking-widest text-white font-light uppercase">Pre-Order Bag</h2>
                    <button onClick={onClose} className="text-gray-400 hover:text-white">
                        <IconX className="h-6 w-6" />
                    </button>
                </div>
                <div className="flex-1 overflow-y-auto p-6 scrollbar-hide">
                    {items.length === 0 ? (
                        <div className="flex flex-col items-center justify-center h-full text-gray-500 space-y-4">
                            <IconShoppingBag className="h-12 w-12 opacity-20" />
                            <p className="text-sm tracking-widest">カートに商品はありません。</p>
                        </div>
                    ) : (
                        <div className="space-y-6">
                            {items.map((item, index) => (
                                <div key={index} className="flex gap-4 border-b border-gray-800 pb-4">
                                    <div className="w-20 h-24 bg-gray-900 flex-shrink-0">
                                        <img src={item.image} alt={item.name} className="w-full h-full object-cover grayscale opacity-80" />
                                    </div>
                                    <div className="flex-1 flex flex-col justify-center">
                                        <span className="text-xs text-gray-500 tracking-widest mb-1">{item.series}</span>
                                        <h4 className="text-white text-sm tracking-wide mb-2">{item.name}</h4>
                                        <span className="text-gray-400 font-mono text-sm">¥{item.price.toLocaleString()}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
                {items.length > 0 && (
                    <div className="p-6 border-t border-gray-800 bg-[#050505]">
                        <div className="flex justify-between items-center mb-6">
                            <span className="text-gray-400 tracking-widest text-sm">TOTAL</span>
                            <span className="text-white font-mono text-xl">¥{total.toLocaleString()}</span>
                        </div>
                        <button className="w-full py-4 bg-white text-black font-medium tracking-widest uppercase hover:bg-gray-200 transition-colors">
                            Proceed to Checkout
                        </button>
                    </div>
                )}
            </div>
        </div>
    );
};

/* ── App ── */
function App() {
    const [cartItems, setCartItems] = useState([]);
    const [isCartOpen, setIsCartOpen] = useState(false);

    const addToCart = (product) => {
        setCartItems([...cartItems, product]);
        setIsCartOpen(true);
    };

    return (
        <div className="min-h-screen bg-[#050505] text-gray-300 font-sans selection:bg-white selection:text-black scroll-smooth">
            <Header cartCount={cartItems.length} toggleCart={() => setIsCartOpen(true)} />
            <main>
                <Hero />
                <Collection onAddToCart={addToCart} />
                <Lookbook />
            </main>
            <Footer />
            <CartModal
                isOpen={isCartOpen}
                onClose={() => setIsCartOpen(false)}
                items={cartItems}
            />
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
