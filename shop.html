<!DOCTYPE html>
<html lang="ja" style="background-color: #050505;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>Sleepless City Factory | NAY Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains Mono', monospace; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ── SVG Icons ── */
const IconShoppingBag = ({ className = "h-6 w-6" }) => (
    <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path strokeLinecap="round" strokeLinejoin="round" d="M16 10a4 4 0 0 1-8 0"/>
    </svg>
);
const IconMenu = ({ className = "h-6 w-6" }) => (
    <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
        <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
);
const IconX = ({ className = "h-6 w-6" }) => (
    <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
);
const IconChevronRight = ({ className = "h-4 w-4" }) => (
    <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
        <polyline points="9 18 15 12 9 6"/>
    </svg>
);

/* ── Header ── */
const Header = ({ cartCount, toggleCart }) => (
    <header className="fixed w-full top-0 z-50 bg-[#0a0a0a]/90 backdrop-blur-md border-b border-gray-800">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex justify-between items-center h-16">
                <div className="flex items-center">
                    <IconMenu className="h-6 w-6 text-gray-300 mr-4 cursor-pointer hover:text-white" />
                    <h1 className="text-xl font-bold tracking-widest text-white uppercase">Sleepless City Factory</h1>
                </div>
                <div className="flex items-center space-x-6">
                    <nav className="hidden md:flex space-x-6 text-sm tracking-wide text-gray-400">
                        <a href="#concept" className="hover:text-white transition-colors">CONCEPT</a>
                        <a href="#collection" className="hover:text-white transition-colors">COLLECTION</a>
                        <a href="#lookbook" className="hover:text-white transition-colors">LOOKBOOK</a>
                        <a href="index.html" className="hover:text-purple-400 transition-colors text-gray-600 border-l border-gray-700 pl-6">← NAY TERMINAL</a>
                    </nav>
                    <button onClick={toggleCart} className="relative text-gray-300 hover:text-white">
                        <IconShoppingBag className="h-6 w-6" />
                        {cartCount > 0 && (
                            <span className="absolute -top-1 -right-2 bg-gray-200 text-black text-xs font-bold rounded-full h-4 w-4 flex items-center justify-center">
                                {cartCount}
                            </span>
                        )}
                    </button>
                </div>
            </div>
        </div>
    </header>
);

/* ── Hero ── */
const Hero = () => (
    <section id="concept" className="relative h-screen flex items-center justify-center bg-[#050505] overflow-hidden">
        <div className="absolute inset-0 z-0 opacity-40">
            <div className="absolute inset-0 bg-gradient-to-b from-transparent to-[#050505] z-10"></div>
            <img
                src="./Men_and_women_202604021418.jpeg"
                alt="Hero Image"
                className="w-full h-full object-cover grayscale"
            />
        </div>
        <div className="relative z-10 text-center px-4 max-w-3xl">
            <div className="text-xs text-gray-600 tracking-[0.5em] mb-4 uppercase">NAY Official Store</div>
            <h2 className="text-4xl md:text-6xl font-light tracking-[0.2em] text-white mb-6">不夜城工廠</h2>
            <p className="text-sm md:text-base text-gray-400 tracking-widest leading-relaxed mb-8">
                深夜の創造、あるいは逃避行のための制服。<br />
                プロの現場で要求される機能性と、静寂に溶け込む美学。<br />
                無駄を削ぎ落としたシルエットに、僅かなノイズを込めて。
            </p>
            <a href="#collection" className="inline-flex items-center px-8 py-3 border border-gray-600 text-sm tracking-widest text-white hover:bg-white hover:text-black transition-all duration-300">
                VIEW COLLECTION <IconChevronRight className="ml-2 h-4 w-4" />
            </a>
        </div>
    </section>
);

/* ── Product Card ── */
const ProductCard = ({ product, onAdd }) => {
    const [selectedColor, setSelectedColor] = useState(product.colors[0]);

    return (
        <div className="group flex flex-col bg-[#0a0a0a] border border-gray-800 overflow-hidden hover:border-gray-600 transition-colors duration-300">
            <div className="relative aspect-[3/4] overflow-hidden bg-gray-900">
                <img
                    src={product.image}
                    alt={product.name}
                    className="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-700 opacity-80 group-hover:opacity-100 grayscale hover:grayscale-0"
                />
                <div className="absolute top-4 left-4 bg-black/60 backdrop-blur-sm px-3 py-1 border border-gray-700">
                    <span className="text-xs text-gray-300 tracking-widest">{product.series}</span>
                </div>
            </div>
            <div className="p-6 flex flex-col flex-grow justify-between">
                <div>
                    <div className="flex justify-between items-start mb-2">
                        <h3 className="text-lg font-medium text-white tracking-wide">{product.name}</h3>
                        <span className="text-sm text-gray-400 font-mono">¥{product.price.toLocaleString()}</span>
                    </div>
                    <p className="text-sm text-gray-500 mb-4 leading-relaxed">{product.description}</p>

                    {product.colors.length > 0 && (
                        <div className="mb-6">
                            <span className="block text-xs text-gray-500 mb-2 tracking-widest uppercase">Color: {selectedColor.name}</span>
                            <div className="flex space-x-2">
                                {product.colors.map(color => (
                                    <button
                                        key={color.name}
                                        onClick={() => setSelectedColor(color)}
                                        className={`w-6 h-6 rounded-full border ${selectedColor.name === color.name ? 'border-white' : 'border-transparent'}`}
                                        style={{ backgroundColor: color.hex }}
                                        aria-label={color.name}
                                    />
                                ))}
                            </div>
                        </div>
                    )}
                </div>

                <button
                    onClick={() => onAdd({ ...product, selectedColor })}
                    className="w-full py-3 bg-white text-black text-sm tracking-widest font-medium hover:bg-gray-200 transition-colors uppercase"
                >
                    Pre-Order
                </button>
            </div>
        </div>
    );
};

/* ── Collection ── */
const Collection = ({ onAddToCart }) => {
    const products = [
        {
            id: 1, series: '壱號系列', name: '特務短上着', price: 88000,
            description: '高密度ヘビーナイロンを使用したショート丈ジャケット。18Kメッキボタンと、襟裏に施された極細の銀刺繍が静かな主張を持つ。',
            colors: [{ name: '墨黒 (Jet Black)', hex: '#111111' }, { name: '鉄紺 (Midnight Navy)', hex: '#1e293b' }, { name: '煤灰 (Concrete Gray)', hex: '#4b5563' }],
            image: './%E7%89%B9%E5%8B%99%E5%A4%96%E5%A5%97_product_photo_202604021504.jpeg'
        },
        {
            id: 2, series: '壱號系列', name: '多袋式戦術ベスト', price: 54000,
            description: 'バリスティックナイロン製の多機能ベスト。特定の嗜好品やピックを収納するための専用スリットを備え、現場での機動性を極限まで高める。',
            colors: [{ name: '墨黒 (Jet Black)', hex: '#111111' }],
            image: './%E3%81%93%E3%82%8C%E3%81%AE%E4%B8%8A%E4%B8%8B%E3%81%AE%E3%83%97%E3%83%AD%E3%83%80%E3%82%AF%E3%83%88%E3%83%95%E3%82%A9%E3%83%88%E3%82%92%E6%92%AE%E5%BD%B1%E3%81%97%E3%81%A6_202604021504.jpeg'
        },
        {
            id: 3, series: '弐號系列', name: '反射広軌・鳶袴', price: 42000,
            description: '日本の伝統的なワークウェアを現代的に再構築。裾の絞り部分にブラックリフレクターを配置し、足元の境界線を鋭く浮かび上がらせる。',
            colors: [{ name: '墨黒 (Jet Black)', hex: '#111111' }, { name: '鉄紺 (Midnight Navy)', hex: '#1e293b' }],
            image: './%E3%81%93%E3%82%8C%E3%81%AE%E3%82%BB%E3%83%83%E3%83%88%E3%82%A2%E3%83%83%E3%83%97%E3%81%A7%E7%9D%80%E3%82%8C%E3%82%8B%E3%82%88%E3%81%86%E3%81%AB%E3%80%81%E3%82%B7%E3%82%A7%E3%83%95%E3%83%91%E3%83%B3%E3%83%84%E3%82%82%E7%94%A8%E6%84%8F_202604021504.jpeg'
        },
        {
            id: 4, series: '参號系列', name: '極彩色・開襟シャツ', price: 68000,
            description: '最高級シルク100%のオープンカラーシャツ。エンジン分解図を独自にパターン化したモノグラムが、重厚なドレープを生み出す。',
            colors: [{ name: '冷徹銀 (Silver Line)', hex: '#e5e7eb' }, { name: '琥珀金 (Gold Line)', hex: '#d4af37' }],
            image: './%E6%A5%B5%E5%BD%A9%E8%89%B2%E3%83%BB%E9%96%8B%E8%A5%9F%E3%82%B7%E3%83%A3%E3%83%84_%E4%BF%A1%E5%8F%B7%E9%9B%B2%E7%B4%8B_202604021346.jpeg'
        },
        {
            id: 5, series: '装備品', name: '不夜城・結界バンダナ', price: 12000,
            description: 'シルク素材のオリジナルバンダナ。緻密に計算されたパターンと、隅に施された箔押しが特徴。',
            colors: [{ name: '墨黒 (Jet Black)', hex: '#111111' }],
            image: './Girl_wearing_bandana_202604021403.jpeg'
        },
        {
            id: 6, series: '装備品', name: '電氣武乱・重厚硝子器', price: 18000,
            description: '重心を低く設計した専用ロックグラス。底面にはレーザー刻印が施されており、氷を沈めた際の音の反響まで計算されている。',
            colors: [{ name: '透明 (Clear)', hex: '#ffffff' }],
            image: './Electric_chaos_open_202604021406.jpeg'
        }
    ];

    return (
        <section id="collection" className="py-24 bg-[#050505]">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="mb-16 border-b border-gray-800 pb-4">
                    <h2 className="text-2xl tracking-[0.2em] text-white uppercase font-light">Collection</h2>
                    <p className="text-sm text-gray-500 tracking-widest mt-2">完全受注生産 / 2026 Q3 Delivery</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    {products.map(product => (
                        <ProductCard key={product.id} product={product} onAdd={onAddToCart} />
                    ))}
                </div>
            </div>
        </section>
    );
};

/* ── Lookbook ── */
const Lookbook = () => (
    <section id="lookbook" className="py-24 bg-[#0a0a0a]">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="mb-16 border-b border-gray-800 pb-4">
                <h2 className="text-2xl tracking-[0.2em] text-white uppercase font-light">Lookbook</h2>
            </div>
            <div className="space-y-24">
                <div className="flex flex-col md:flex-row items-center gap-12">
                    <div className="w-full md:w-1/2 aspect-[3/4] relative overflow-hidden bg-gray-900">
                        <img src="./%E3%81%93%E3%82%8C%E3%81%AE%E4%B8%8A%E4%B8%8B%E3%81%AE%E3%83%97%E3%83%AD%E3%83%80%E3%82%AF%E3%83%88%E3%83%95%E3%82%A9%E3%83%88%E3%82%92%E6%92%AE%E5%BD%B1%E3%81%97%E3%81%A6_202604021505.jpeg" alt="Look 1" className="w-full h-full object-cover grayscale opacity-70" />
                    </div>
                    <div className="w-full md:w-1/2 space-y-6">
                        <span className="text-xs tracking-widest text-gray-500 uppercase">Look 01</span>
                        <h3 className="text-3xl font-light tracking-wide text-white">The Night Operation</h3>
                        <p className="text-gray-400 leading-relaxed tracking-wide text-sm">
                            特務短上着と反射広軌・鳶袴のセットアップ。足元にはMaison MargielaのTabiブーツを配置。
                            伝統的なワークウェアのシルエットをモードに昇華し、現場での実用性と都市の静寂に溶け込む匿名性を確保する。
                        </p>
                        <div className="pt-4 border-t border-gray-800 flex flex-col gap-2 text-sm text-gray-500 font-mono">
                            <span>OUTER: 特務短上着 (鉄紺)</span>
                            <span>BOTTOM: 反射広軌・鳶袴 (鉄紺)</span>
                            <span>MASK: 不夜城・結界バンダナ</span>
                        </div>
                    </div>
                </div>
                <div className="flex flex-col md:flex-row-reverse items-center gap-12">
                    <div className="w-full md:w-1/2 aspect-[4/3] relative overflow-hidden bg-gray-900">
                        <img src="./Half_sleeve_and_202604021504.jpeg" alt="Look 2" className="w-full h-full object-cover grayscale opacity-80" />
                    </div>
                    <div className="w-full md:w-1/2 space-y-6">
                        <span className="text-xs tracking-widest text-gray-500 uppercase">Look 02</span>
                        <h3 className="text-3xl font-light tracking-wide text-white">Intellectual Outlaw</h3>
                        <p className="text-gray-400 leading-relaxed tracking-wide text-sm">
                            極彩色・開襟シャツに多袋式戦術ベストをレイヤード。
                            無機質な機材や車両（EF Civic）を背景に、冷徹なエンジニアとしての顔とストリートの衝動を同居させるスタイリング。
                        </p>
                        <div className="pt-4 border-t border-gray-800 flex flex-col gap-2 text-sm text-gray-500 font-mono">
                            <span>TOPS: 極彩色・開襟シャツ (冷徹銀)</span>
                            <span>VEST: 多袋式戦術ベスト (墨黒)</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
);

/* ── Footer ── */
const Footer = () => (
    <footer className="bg-[#050505] border-t border-gray-900 py-12">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-8">
            <div>
                <h1 className="text-lg font-bold tracking-widest text-white uppercase mb-2">Sleepless City Factory</h1>
                <p className="text-xs text-gray-600 tracking-widest">© 2026 N-STAGE / NAY. ALL RIGHTS RESERVED.</p>
            </div>
            <div className="flex flex-wrap justify-center gap-6 text-xs tracking-widest text-gray-500">
                <a href="#" className="hover:text-white transition-colors">TERMS</a>
                <a href="#" className="hover:text-white transition-colors">PRIVACY</a>
                <a href="#" className="hover:text-white transition-colors">CONTACT</a>
                <a href="index.html" className="hover:text-purple-400 transition-colors border-l border-gray-700 pl-6">← NAY TERMINAL</a>
            </div>
        </div>
    </footer>
);

/* ── Cart Modal ── */
const CartModal = ({ isOpen, onClose, items }) => {
    if (!isOpen) return null;
    const total = items.reduce((sum, item) => sum + item.price, 0);

    return (
        <div className="fixed inset-0 z-[100] flex justify-end">
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose}></div>
            <div className="relative w-full max-w-md bg-[#0a0a0a] border-l border-gray-800 h-full flex flex-col shadow-2xl transform transition-transform duration-300">
                <div className="p-6 border-b border-gray-800 flex justify-between items-center">
                    <h2 className="text-xl tracking-widest text-white font-light uppercase">Pre-Order Bag</h2>
                    <button onClick={onClose} className="text-gray-400 hover:text-white">
                        <IconX className="h-6 w-6" />
                    </button>
                </div>
                <div className="flex-1 overflow-y-auto p-6 scrollbar-hide">
                    {items.length === 0 ? (
                        <div className="flex flex-col items-center justify-center h-full text-gray-500 space-y-4">
                            <IconShoppingBag className="h-12 w-12 opacity-20" />
                            <p className="text-sm tracking-widest">カートに商品はありません。</p>
                        </div>
                    ) : (
                        <div className="space-y-6">
                            {items.map((item, index) => (
                                <div key={index} className="flex gap-4 border-b border-gray-800 pb-4">
                                    <div className="w-20 h-24 bg-gray-900 flex-shrink-0">
                                        <img src={item.image} alt={item.name} className="w-full h-full object-cover grayscale opacity-80" />
                                    </div>
                                    <div className="flex-1 flex flex-col justify-center">
                                        <span className="text-xs text-gray-500 tracking-widest mb-1">{item.series}</span>
                                        <h4 className="text-white text-sm tracking-wide mb-2">{item.name}</h4>
                                        <span className="text-gray-400 font-mono text-sm">¥{item.price.toLocaleString()}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
                {items.length > 0 && (
                    <div className="p-6 border-t border-gray-800 bg-[#050505]">
                        <div className="flex justify-between items-center mb-6">
                            <span className="text-gray-400 tracking-widest text-sm">TOTAL</span>
                            <span className="text-white font-mono text-xl">¥{total.toLocaleString()}</span>
                        </div>
                        <button className="w-full py-4 bg-white text-black font-medium tracking-widest uppercase hover:bg-gray-200 transition-colors">
                            Proceed to Checkout
                        </button>
                    </div>
                )}
            </div>
        </div>
    );
};

/* ── App ── */
function App() {
    const [cartItems, setCartItems] = useState([]);
    const [isCartOpen, setIsCartOpen] = useState(false);

    const addToCart = (product) => {
        setCartItems([...cartItems, product]);
        setIsCartOpen(true);
    };

    return (
        <div className="min-h-screen bg-[#050505] text-gray-300 font-sans selection:bg-white selection:text-black scroll-smooth">
            <Header cartCount={cartItems.length} toggleCart={() => setIsCartOpen(true)} />
            <main>
                <Hero />
                <Collection onAddToCart={addToCart} />
                <Lookbook />
            </main>
            <Footer />
            <CartModal
                isOpen={isCartOpen}
                onClose={() => setIsCartOpen(false)}
                items={cartItems}
            />
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
